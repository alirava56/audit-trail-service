name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.5', '24.22.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Reproducible install (no third-party dependencies)
        run: npm ci --ignore-scripts
      - name: Syntax / unit / HTTP integration / smoke
        run: npm run check
      - name: Persistent database / checkpoint / backup / restore drill
        run: npm run e2e:disk
      - name: Coverage report
        run: npm run test:coverage
      - name: Verify no tracked secrets or DB files
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|.*\.sqlite($|-)|.*\.db($|-)|node_modules/)'; then
            echo 'Forbidden tracked runtime file' >&2
            exit 1
          fi
  docker:
    name: Docker / real startup + persistent volume
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js for smoke assertions
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
      - name: Build production image
        run: docker build --pull -t audit-trail-ci .
      - name: Test exact deployment contract and persistence
        run: bash scripts/ci-docker-smoke.sh
