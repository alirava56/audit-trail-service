# Example only — install Nginx and obtain a real TLS certificate first.
# Place 'limit_req_zone' in the http context (e.g., in conf.d included in http).
# Restrict network access to known upstream clients using your firewall or
# allow/deny here. Never expose the Node.js listener directly on the internet.
limit_req_zone $binary_remote_addr zone=audit_client_limit:10m rate=10r/s;

server {
    listen 80;
    server_name audit.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name audit.example.com;

    ssl_certificate     /etc/letsencrypt/live/audit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 12k;
    client_body_timeout 10s;

    location / {
        limit_req zone=audit_client_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
